# Đóng gói PaperVault.exe trên máy Windows của GitHub, tạo bộ cài (Inno Setup, app/installer/PaperVault.iss) và đính kèm
# PaperVault-Setup-<ver>.exe cùng bản portable PaperVault-windows.zip vào Release.
# Phát hành phiên bản mới: viết ghi chú vào .github/RELEASE_NOTES.md (app hiện nội dung này trong thẻ "Có bản mới"),
# tăng APP_VERSION trong app/server.py (bộ cài lấy số phiên bản từ đây, phải khớp tag), tạo tag dạng v1.2.0 rồi push
# (git tag v1.2.0 && git push origin v1.2.0).
# Chạy tay ở tab Actions → Build PaperVault → Run workflow: chỉ tạo bộ cài và file zip trong mục Artifacts để thử.
name: Build PaperVault

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt

      - name: Đóng gói .exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name PaperVault
          --icon static\icons\papervault.ico
          --add-data "static;static" --add-data "rankings;rankings"
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
          --hidden-import tray --hidden-import zotero_import
          desktop.py

      - name: Kiểm tra bản đóng gói đủ file
        shell: pwsh
        run: |
          # Bản 1.0 → 1.3.4 thiếu lõi PDF.js vì .gitignore bỏ nhầm static/vendor/pdfjs/build, CI vẫn build xanh.
          $need = 'pdfjs\build\pdf.mjs', 'pdfjs\build\pdf.worker.mjs', 'pdfjs\web\viewer.html', 'pdfjs\web\viewer.mjs', 'mermaid', 'katex'
          $missing = $need | Where-Object { -not (Test-Path "dist\PaperVault\_internal\static\vendor\$_") }
          if ($missing) { throw "Bản đóng gói thiếu: $($missing -join ', ')" }

      - name: Nén thành zip
        shell: pwsh
        run: |
          Copy-Item ..\LICENSE dist\PaperVault\
          Compress-Archive -Path dist\PaperVault -DestinationPath PaperVault-windows.zip -Force

      - name: Tạo bộ cài (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path server.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and "v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "APP_VERSION trong server.py ($ver) không khớp tag $env:GITHUB_REF_NAME"
          }
          # Bản dịch tiếng Việt (installer/Vietnamese.isl) cần Inno Setup 6.5 trở lên: cài / nâng cấp bằng Chocolatey.
          choco upgrade innosetup -y --no-progress
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc /Q installer\PaperVault.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item dist\PaperVault-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PaperVault-windows
          path: |
            app/PaperVault-windows.zip
            app/dist/PaperVault-Setup-*.exe

      - name: Đính kèm vào Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/PaperVault-Setup-*.exe
            app/PaperVault-windows.zip
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
