<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperVault</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/icon48.png">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Bản app trong một khung chia đôi (?embed=1): ẩn thanh bên + thanh trên ngay từ đầu, dùng chung cầu nối desktop của cửa sổ chính.
    if (/[?&]embed=1/.test(location.search)) {
      document.documentElement.classList.add('embed');
      try { if (!window.pywebview && window.parent !== window) Object.defineProperty(window, 'pywebview', { configurable: true, get: () => window.parent.pywebview }); } catch (_) { /* khác nguồn */ }
    }
  </script>
</head>
<body>
  <!-- Bộ icon nét (stroke) dùng chung, gọi bằng <svg class="i"><use href="#i-..."/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.5" y="4" width="4.5" height="16" rx="1"/><path d="m15.8 5.4 3.6-.9 3.1 14.4-3.6.9z"/></symbol>
      <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></symbol>
      <symbol id="i-rss" viewBox="0 0 24 24"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.2"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></symbol>
      <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M6.5 9h3M14.5 9h3M6.5 13h3M14.5 13h3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 2.6"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.3-4.3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="i-notebook" viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M3.5 7H6M3.5 12H6M3.5 17H6"/><path d="M10 8h5M10 12h5"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3v3H8z"/></symbol>
      <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/><path d="M7 11h6M7 15h4"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13"/><path d="M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <nav class="nav" id="nav">
      <a class="brand" href="#/">
        <img src="icons/logo.svg" alt="" width="30" height="30">
        <span class="brand-txt"><b>PaperVault</b><small>Thư viện nghiên cứu</small></span>
      </a>
      <!-- Nhóm theo luồng làm việc: gom paper -> khám phá và phân tích -> ghi chép. Nhãn ngắn một dòng, tên đầy đủ ở data-full (hiện khi rê chuột). -->
      <div class="nav-sec">Thư viện</div>
      <a href="#/" data-route="" data-full="Tổng quan"><svg class="i"><use href="#i-dashboard"/></svg><span class="nav-l">Tổng quan</span></a>
      <a href="#/library" data-route="library" data-full="Thư viện paper"><svg class="i"><use href="#i-library"/></svg><span class="nav-l">Thư viện</span></a>
      <a href="#/add" data-route="add" data-full="Thêm paper"><svg class="i"><use href="#i-file-plus"/></svg><span class="nav-l">Thêm paper</span><span id="nav-inbox" class="nav-badge" hidden></span></a>
      <a href="#/topics" data-route="topics" data-full="Chủ đề"><svg class="i"><use href="#i-folder"/></svg><span class="nav-l">Chủ đề</span></a>
      <div class="nav-sec">Khám phá &amp; phân tích</div>
      <a href="#/feed" data-route="feed" data-full="Theo dõi paper mới"><svg class="i"><use href="#i-rss"/></svg><span class="nav-l">Paper mới</span></a>
      <a href="#/chat" data-route="chat" data-full="Chat với paper"><svg class="i"><use href="#i-chat"/></svg><span class="nav-l">Chat với paper</span></a>
      <a href="#/compare" data-route="compare" data-full="So sánh &amp; tổng hợp"><svg class="i"><use href="#i-compare"/></svg><span class="nav-l">So sánh</span></a>
      <div class="nav-sec">Cá nhân</div>
      <a href="#/notebook" data-route="notebook" data-full="Sổ tay nghiên cứu"><svg class="i"><use href="#i-notebook"/></svg><span class="nav-l">Sổ tay</span></a>
      <a href="#/calendar" data-route="calendar" data-full="Lịch kế hoạch (nối với nhật ký)"><svg class="i"><use href="#i-calendar"/></svg><span class="nav-l">Lịch</span></a>
      <a href="#/notes" data-route="notes" data-full="Ghi chú &amp; thẻ ghi nhớ"><svg class="i"><use href="#i-cards"/></svg><span class="nav-l">Thẻ ghi nhớ</span></a>
      <div class="nav-foot">
        <a href="#/settings" data-route="settings"><svg class="i"><use href="#i-settings"/></svg><span class="nav-l">Cài đặt</span></a>
        <a href="#/help" data-route="help"><svg class="i"><use href="#i-help"/></svg><span class="nav-l">Hướng dẫn</span></a>
        <button id="theme-toggle" class="nav-btn" title="Đổi giao diện sáng/tối"><svg class="i"><use href="#i-moon"/></svg><span id="theme-label">Giao diện tối</span></button>
        <div id="conn" class="conn"></div>
      </div>
    </nav>

    <div class="content">
      <header class="topbar">
        <button id="nav-toggle" class="icon-btn" title="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input type="search" id="global-search" placeholder="Tìm paper, nội dung PDF, sổ tay, chat, lịch…" title="Tìm nhanh (Ctrl+K hoặc /)">
          <kbd>Ctrl K</kbd>
        </label>
        <span class="spacer"></span>
        <span id="sel-info" class="sel-pill"></span>
        <button id="btn-split" class="icon-btn" title="Chia đôi màn hình (Ctrl+\)"><svg class="i"><use href="#i-split"/></svg></button>
        <button id="btn-translate" class="icon-btn tr-btn" title="Dịch khi bôi đen: cài đặt nhanh, ghi chú &amp; thẻ ghi nhớ">文</button>
        <a id="btn-help" class="icon-btn" href="#/help" title="Hướng dẫn cho trang này"><svg class="i"><use href="#i-help"/></svg></a>
        <button id="btn-quick-add" class="primary"><svg class="i"><use href="#i-plus"/></svg>Thêm paper</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/katex/katex.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
